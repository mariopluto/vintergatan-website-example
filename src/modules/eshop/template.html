<section class="py-16 px-4 sm:px-6 w-full bg-black border-y border-slate-800 relative z-20">
    <div class="max-w-4xl mx-auto text-center">
        <!-- Section Header -->
        <h3 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">
            Hur kan en server hantera sig själv?
        </h3>
        <p class="mt-3 text-slate-400 text-sm sm:text-base max-w-2xl mx-auto">
            Testa! (<code class="text-xs text-cyan-300 bg-cyan-950/60 px-1.5 py-0.5 rounded border border-cyan-800/40">/api/module/eshop/checkout</code>) är för att processa API requests.
        </p>

        <!-- Dynamic Card Wrapper -->
        <div class="mt-10 p-8 rounded-2xl bg-slate-950 border border-slate-800 shadow-2xl relative overflow-hidden">
            <!-- Glow background effect -->
            <div class="absolute -top-12 -right-12 w-40 h-40 bg-cyan-500/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="max-w-md mx-auto space-y-6">
                <!-- Product Information -->
                <div class="flex items-center justify-between p-4 rounded-xl bg-slate-900/80 border border-slate-800">
                    <div class="text-left">
                        <span class="block text-white font-semibold text-base">Exempel</span>
                        <span class="text-xs text-slate-400">Att skicka: <code class="text-purple-300">{ productId: 'test-kit' }</code></span>
                    </div>
                    <span class="text-lg font-bold text-cyan-400">Gratis Test!</span>
                </div>

                <!-- Action Button -->
                <button id="checkout-btn" class="w-full py-3.5 px-6 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-semibold text-sm transition-all duration-200 shadow-[0_0_20px_rgba(168,85,247,0.3)] hover:shadow-[0_0_25px_rgba(168,85,247,0.5)] active:scale-[0.99] flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-purple-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    Testa att ringa servern!
                </button>

                <!-- Live Response Output Terminal -->
                <div class="p-4 rounded-xl bg-black/90 border border-slate-800 text-left min-h-[52px] flex items-center">
                    <p id="response-msg" class="text-xs font-mono text-slate-500 w-full truncate">
                        Status: Redo att skicka ett meddelande...
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
