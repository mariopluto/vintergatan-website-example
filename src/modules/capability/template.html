<section class="py-16 px-4 sm:px-6 w-full bg-black border-y border-slate-800 relative z-20">
    <div class="max-w-4xl mx-auto">
        <!-- Section Header -->
        <div class="text-center max-w-2xl mx-auto mb-10">
            <h3 class="text-2xl sm:text-4xl font-extrabold text-white tracking-tight mt-4">
                Vad kan vi göra?
            </h3>
            <p class="mt-3 text-slate-400 text-sm sm:text-base">
                Här är en terminal som du kan skriva in frågor eller svar på! 
            </p>
        </div>

        <!-- Terminal Window Card -->
        <div class="rounded-2xl bg-slate-950 border border-slate-800 shadow-2xl overflow-hidden text-left">
            <div class="bg-slate-900 px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-rose-500/80"></span>
                    <span class="w-3 h-3 rounded-full bg-amber-500/80"></span>
                    <span class="w-3 h-3 rounded-full bg-emerald-500/80"></span>
                </div>
                <span class="text-xs font-mono text-slate-400">vintergatan-cli v2.0.26</span>
                <div class="w-12"></div>
            </div>

            <!-- Terminal Output Area -->
            <div id="terminal-output" class="p-6 font-mono text-xs sm:text-sm h-72 overflow-y-auto space-y-3 bg-black/90">
                <p class="text-slate-500">Skriv <code class="text-cyan-400">help</code> eller tryck på en knapp under och testa!.</p>
            </div>

            <!-- Quick Action Command Buttons -->
            <div class="p-3 bg-slate-900/60 border-t border-slate-800 flex flex-wrap gap-2 text-xs font-mono">
                <button data-cmd="status" class="quick-cmd-btn px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 transition">
                    > status
                </button>
                <button data-cmd="speed-test" class="quick-cmd-btn px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-purple-300 border border-slate-700 transition">
                    > speed-test
                </button>
                <button data-cmd="modules" class="quick-cmd-btn px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-slate-700 transition">
                    > modules
                </button>
                <button data-cmd="clear" class="quick-cmd-btn px-3 py-1.5 rounded-lg bg-slate-800/50 hover:bg-slate-800 text-slate-400 border border-slate-800 transition ml-auto">
                    clear
                </button>
            </div>

            <!-- Interactive Command Line Input -->
            <form id="terminal-form" class="flex items-center px-4 py-3 bg-slate-950 border-t border-slate-800">
                <span class="text-cyan-400 font-mono text-sm mr-2.5">vintergatan$&nbsp;</span>
                <input 
                    type="text" 
                    id="terminal-input" 
                    class="flex-grow bg-transparent text-white font-mono text-sm focus:outline-none placeholder-slate-600"
                    placeholder="skriv kommando (e.g., status, speed-test, help)..."
                    autocomplete="off"
                >
                <button type="submit" class="text-xs font-mono text-cyan-400 hover:text-cyan-300 px-3 py-1">Run</button>
            </form>
        </div>
    </div>
</section>
