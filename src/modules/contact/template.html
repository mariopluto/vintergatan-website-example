<section class="py-16 px-4 sm:px-6 w-full bg-black border-y border-slate-800 relative z-20">
    <div class="max-w-5xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
            
            <!-- Left Column: Value Prop & Info -->
            <div class="lg:col-span-5 text-left space-y-6">
                <h3 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                    Låt ditt projekt flyga!
                </h3>
                <p class="text-slate-400 text-sm sm:text-base leading-relaxed">
                    Har du ett projekt du vill testa, eller något annat viktigt? Skicka ett meddelande!
                </p>
                <div class="pt-2 space-y-3 text-xs text-slate-400 font-mono">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                        <span>API: <code class="text-purple-300">/api/module/contact/submit</code></span>
                    </div>
                </div>
            </div>

            <!-- Right Column: Interactive Contact Form Card -->
            <div class="lg:col-span-7">
                <div class="p-8 rounded-2xl bg-slate-950 border border-slate-800 shadow-2xl relative overflow-hidden text-left">
                    <form id="contact-form" class="space-y-5">
                        <div>
                            <label for="contact-email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                                Email Address
                            </label>
                            <input 
                                type="email" 
                                id="contact-email" 
                                required
                                class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all duration-200" 
                                placeholder="you@company.com"
                            >
                        </div>

                        <div>
                            <label for="contact-message" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                                Meddelande
                            </label>
                            <textarea 
                                id="contact-message" 
                                rows="4" 
                                required
                                class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all duration-200 resize-none" 
                                placeholder="Berätta för oss om ert projekt eller vad ni tänkt..."
                            ></textarea>
                        </div>

                        <button 
                            type="submit" 
                            id="contact-submit-btn" 
                            class="w-full py-3.5 px-6 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-semibold text-sm transition-all duration-200 shadow-[0_0_20px_rgba(168,85,247,0.3)] hover:shadow-[0_0_25px_rgba(168,85,247,0.5)] active:scale-[0.99] flex items-center justify-center gap-2"
                        >
                            Skicka Meddelande
                        </button>
                    </form>

                    <!-- Terminal Style Response Output -->
                    <div class="mt-5 p-4 rounded-xl bg-black/90 border border-slate-800 min-h-[52px] flex items-center">
                        <p id="contact-response-msg" class="text-xs font-mono text-slate-500 w-full truncate">
                            Status: väntar...
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
