<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VintergatanWebb</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .wave-letter {
            display: inline-block;
            will-change: transform;
        }
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
                radial-gradient(2px 2px at 20px 30px, #ffffff20, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff30, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff40, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ffffff25, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 100% 100%, 100% 100%, 200px 200px, 200px 200px, 200px 200px, 200px 200px;
        }
    </style>
</head>

<body class="text-slate-200 font-sans antialiased flex flex-col min-h-screen selection:bg-purple-500 selection:text-white">
    <header class="bg-black/95 border-b border-slate-800 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight">
                <a href="/" id="logo-link" class="inline-flex items-center gap-3 p-1 group">
                    <!-- Logo Container -->
                    <div id="brand-logo-slot" class="flex items-center justify-center">
                        <!-- Hover scaling wrapper -->
                        <div class="transition-transform duration-200 group-hover:scale-105">
                            <img id="logo-img" src="/comp_logo.svg" alt="Company Logo" class="h-9 sm:h-11 w-auto object-contain" />
                        </div>
                    </div>
                    
                    <!-- Company Name -->
                    <span class="text-white font-extrabold tracking-wide">
                        <span class="wave-letter">V</span><span class="wave-letter">i</span><span class="wave-letter">n</span><span class="wave-letter">t</span><span class="wave-letter">e</span><span class="wave-letter">r</span><span class="wave-letter">g</span><span class="wave-letter">a</span><span class="wave-letter">t</span><span class="wave-letter">a</span><span class="wave-letter">n</span><span class="wave-letter">W</span><span class="wave-letter">e</span><span class="wave-letter">b</span><span class="wave-letter">b</span>
                    </span>
                </a>
            </h1>

            <!-- NAV menu -->
            <nav class="space-x-4 sm:space-x-6 flex items-center text-sm sm:text-base text-slate-300">
                {{NAV}}
            </nav>
        </div>
    </header>

    <!-- Module content injection point -->
    <main class="flex-grow flex flex-col">
        {{CONTENT}}
    </main>

    <!-- Footer -->
    <footer class="bg-black border-t border-slate-800 py-8 text-center text-slate-400 text-sm mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p>2026 VintergatanWebb.</p>
            <p class="text-slate-500 text-xs"></p>
        </div>
    </footer>

    <!-- Script injection point -->
    <script>
        {{SCRIPTS}}
        document.addEventListener('DOMContentLoaded', () => {
            const logoLink = document.getElementById('logo-link');
            const letters = logoLink.querySelectorAll('.wave-letter');

            let animationFrameId = null;
            let isHovered = false;
            let currentAmplitude = 0;
            const targetMaxAmplitude = 6;
            const speed = 0.007;
            const phaseShift = 0.3;

            function animate(timestamp) {
                const target = isHovered ? targetMaxAmplitude : 0;
                currentAmplitude += (target - currentAmplitude) * 0.1;

                letters.forEach((letter, index) => {
                    const y = Math.sin(timestamp * speed - index * phaseShift) * currentAmplitude;
                    letter.style.transform = `translateY(${y.toFixed(2)}px)`;
                });

                if (isHovered || currentAmplitude > 0.01) {
                    animationFrameId = requestAnimationFrame(animate);
                } else {
                    letters.forEach(letter => letter.style.transform = '');
                    currentAmplitude = 0;
                    animationFrameId = null;
                }
            }

            function ensureAnimationRunning() {
                if (!animationFrameId) {
                    animationFrameId = requestAnimationFrame(animate);
                }
            }

            logoLink.addEventListener('mouseenter', () => {
                isHovered = true;
                ensureAnimationRunning();
            });

            logoLink.addEventListener('mouseleave', () => {
                isHovered = false;
                ensureAnimationRunning();
            });

            const logoImg = document.getElementById('logo-img');

            if (logoImg) {
                window.addEventListener('scroll', () => {
                    // Calculate maximum scrollable distance for the page
                    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;

                    if (maxScroll > 0) {
                        const scrollProgress = window.scrollY / maxScroll;
                        const rotation = scrollProgress * 360;
                        
                        logoImg.style.transform = `rotate(${rotation.toFixed(2)}deg)`;
                    }
                }, { passive: true });
            }

            // Mobile menu logic
            const dropdownBtn = document.getElementById('mobile-dropdown-btn');
            const dropdownMenu = document.getElementById('mobile-dropdown-menu');

            if (dropdownBtn && dropdownMenu) {
                dropdownBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdownMenu.classList.toggle('hidden');
                });

                document.addEventListener('click', (e) => {
                    if (!dropdownMenu.contains(e.target) && !dropdownBtn.contains(e.target)) {
                        dropdownMenu.classList.add('hidden');
                    }
                });
            }

            // Cookie Compliance Script Injection Point (TODO: should be removed for any clients that dont need it)
            {{COOKIE_SCRIPT}}
        });
    </script>

    <!-- Cookie Compliance Banner Injection Point (TODO: should be removed for any clients that dont need it)-->
    {{COOKIE_BANNER}}
</body>
</html>
