<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="w-12 h-12">
  <defs>
    <!-- Gradient: Cosmic Purple to Electric Blue -->
    <linearGradient id="cosmicPurpleBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Purple/Blue Soft Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Orbital Frequency Ring & Lambda Mark -->
  <g filter="url(#purpleGlow)" stroke="url(#cosmicPurpleBlue)" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- Outer Frequency Wave Ring -->
    <circle cx="100" cy="100" r="75" stroke-dasharray="110 20 80 20" />
    
    <!-- Central Serif Lambda (Λ) Geometry -->
    <g stroke-width="6">
      <!-- Left Leg -->
      <line x1="100" y1="55" x2="65" y2="135" />
      <!-- Right Leg -->
      <line x1="100" y1="55" x2="135" y2="135" />
      <!-- Feet Serifs -->
      <line x1="55" y1="135" x2="75" y2="135" />
      <line x1="125" y1="135" x2="145" y2="135" />
    </g>
    
    <!-- Core Starlight Node -->
    <circle cx="100" cy="55" r="4" fill="#A855F7" />
  </g>
</svg>
